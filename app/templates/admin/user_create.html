{% extends "partials/base.html" %}

{% block title %}Create User · Billson's Forms{% endblock %}

{% block content %}

<section class="page-header">
    <h1>Create User</h1>
    <p>
        Create a new user account.
    </p>
</section>

{% if error %}
<section class="alert alert-danger">
    {{ error }}
</section>
{% endif %}

<section class="card">

    <form method="post" action="/admin/users/new" class="form">

        <div class="form-group">
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                value="{{ form.username if form else '' }}"
                required
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label for="display_name">
                Display Name
            </label>

            <input
                type="text"
                id="display_name"
                name="display_name"
                value="{{ form.display_name if form else '' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <div class="form-help">
                Required when creating a user.
            </div>
        </div>

        <div class="form-group">
            <label for="role">
                Role
            </label>

            <select
                id="role"
                name="role"
            >
                <option
                    value="user"
                    {% if form and form.role == "user" %}
                        selected
                    {% endif %}
                >
                    User
                </option>

                <option
                    value="admin"
                    {% if form and form.role == "admin" %}
                        selected
                    {% endif %}
                >
                    Admin
                </option>
            </select>
        </div>

        <div class="form-group checkbox-group">
            <label>
                <input
                    type="checkbox"
                    name="is_active"
                    value="true"
                    {% if not form or form.is_active %}
                        checked
                    {% endif %}
                >

                Active User
            </label>

            <div class="form-help">
                Disabled users cannot log in.
            </div>
        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create User
            </button>

            <a
                href="/admin/users"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</section>

{% endblock %}
