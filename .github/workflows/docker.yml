name: Test, Build and Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-with-at-least-32-characters
      APP_ENCRYPTION_KEY: lvrmNO5YoDl8_pLcV4H_nTpg4LS7WwO8qSkEubdg76E=
      SECURE_COOKIES: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not postgres"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: billsons_forms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d billsons_forms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-with-at-least-32-characters
      APP_ENCRYPTION_KEY: lvrmNO5YoDl8_pLcV4H_nTpg4LS7WwO8qSkEubdg76E=
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/billsons_forms_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/billsons_forms_test
      SECURE_COOKIES: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m app.scripts.test

  docker:
    needs: [unit, postgres]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/dylanbillson/billsons-forms:latest
